function publish(o){o=ZYOrderParser.present(o);if(ZYOrderParser.validateCompany(o,true).length)return '这份原单需要重新核对，暂不能生成发布稿';const labels={title:'职位名称',gender:'招聘性别',age:'年龄要求',language:'语言要求',hours:'工作时间',salary:'工资待遇',rest:'每月休息',workContent:'工作内容',requirements:'工作要求',notes:'其他备注',interview:'面试时间'};return `${o.code}｜${o.title}\n${o.employer?o.employer+'\n':''}`+Object.entries(labels).map(([k,n])=>{const v=k==='notes'?String(o[k]||'').split(/[\n；;。]/).filter(s=>!s.includes('全包')).join('；'):o[k];return v?n+'：'+v:''}).filter(Boolean).join('\n')+'\n卓亚全包价：'+priceFmt(o.price)}

function render(){if(view==='new')return newView();if(view==='workers')return workerView();if(view==='workerRecords')return recordsView();const isToday=view==='dashboard',f=filters[view],all=orders.filter(o=>!isToday||day(o.createdAt)===today());$('#content').innerHTML=`<section class="sticky"><div class="heading"><div><div class="eyebrow">WORKSPACE / ${isToday?'OVERVIEW':'ORDER DATABASE'}</div><h1>${names[view]}</h1><p style="margin:0">${isToday?'每一份机会，都值得认真整理。掌握今日劳务单进度。':'所有劳务单集中管理，原单与公司单随时核对。'}</p></div><div class="actions"><button onclick="openOrderAudit()">原单识别自查 <span data-order-audit-count data-user-content></span></button><button class="primary" onclick="editing=null;go('new')">＋ 整理新劳务单</button></div></div>${isToday?`<div class="stats">${[['今日劳务单总数',all.length,'','今日录入的全部劳务单'],['待确认卓亚全包价',all.filter(o=>o.status==='draft').length,'draft','核对价格后即可生成发布稿'],['今日已完成劳务单',all.filter(o=>o.status==='ready').length,'ready','公司单已就绪，可直接复制发布']].map(([n,c,s,d])=>`<button class="stat" onclick="filters.dashboard.s='${s}';render();$('#results').scrollIntoView({behavior:'smooth'})">${n}<strong>${c}<span style="font-size:12px;font-weight:400;margin-left:8px;color:#9aa5a0">份</span></strong><small>${d}</small></button>`).join('')}</div>`:'<div style="height:24px"></div>'}<div class="toolbar"><input placeholder="搜索岗位或公司单号" value="${esc(f.q)}" oninput="filters[view].q=this.value;listRender()"><select onchange="filters[view].s=this.value;listRender()"><option value="">全部状态</option><option value="draft" ${f.s==='draft'?'selected':''}>待确认卓亚全包价</option><option value="ready" ${f.s==='ready'?'selected':''}>已生成发布稿</option></select></div></section>${!isToday?'<div id="order-calendar"></div>':''}<div id="results"></div>`;if(!isToday)renderOrderCalendar();listRender();window.refreshOrderAuditBadge?.()}
let orderCalendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);

}
const expandedOrderDates=new Set();
function listRender(){const f=filters[view],a=orders.filter(o=>(view!=='dashboard'||day(o.createdAt)===today())&&(ZYOrderParser.present(o).title.toLowerCase().includes(f.q.trim().toLowerCase())||String(o.code||'').toLowerCase().includes(f.q.trim().toLowerCase()))&&(view!=='orders'||!f.date||orderDateKey(o.createdAt)===f.date)&&(!f.s||o.status===f.s));let html=`<div class="listhead"><b>${view==='dashboard'?'今日劳务单':'全部劳务单'}</b><span class="muted">共 ${a.length} 份</span></div>`;if(!a.length)html+='<div class="panel empty">暂无符合条件的劳务单<br><small>整理一份新劳务单，开始今天的工作。</small></div>';else if(view==='orders'){const groups={};a.forEach(o=>(groups[day(o.createdAt)]??=[]).push(o));Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(d=>{html+=`<details class="order-date-group" ${expandedOrderDates.has(d)?'open':''}><summary onclick="expandedOrderDates[this.parentElement.open?'delete':'add'](this.dataset.date)" data-date="${esc(d)}"><span data-user-content>${esc(d)}</span><span class="muted">共 ${groups[d].length} 份</span></summary><div class="order-date-content">${groups[d].map(card).join('')}</div></details>`})}else html+=a.map(card).join('');$('#results').innerHTML=html}
async function deleteOrder(id){if(confirm('确定删除这份劳务单？删除后无法恢复。')){const old=orders;orders=orders.filter(o=>o.id!==id);if(!await persist())orders=old;render()}}function editOrder(id){editing=id;mode='single';go('new')}function fillPrice(id){const o=orders.find(x=>x.id===id);$('#modal').innerHTML=`<h2>确认卓亚全包价</h2><p data-user-content>${esc(o.code)} · ${esc(o.title)}</p><label>卓亚全包价<input id="price-input" value="${esc(o.price)}" placeholder="例如 3.8w；空或0为待确认"></label><div class="actions"><button onclick="$('#modal').close()">取消</button><button class="primary" onclick="savePrice('${esc(id)}')">保存价格</button></div>`;$('#modal').showModal()}async function savePrice(id){const o=orders.find(x=>x.id===id),v=$('#price-input').value.trim(),old={...o};Object.assign(o,{price:v,status:status(v)});if(!await persist()){Object.assign(o,old);return}$('#modal').close();render();toast('价格已保存')}
function newView(){const o=ZYOrderParser.present(orders.find(x=>x.id===editing)||{});$('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">ORDER WORKSPACE</div><h1>${editing?'编辑公司单':'整理新劳务单'}</h1><p>移除上游编号，核对原单，再生成清晰的公司发布稿。</p></div><button onclick="editing=null;go('orders')">返回列表</button></div><div class="steps"><span>① 录入原单</span><span>② 确认信息</span><span>③ 确认全包价并生成</span></div>${!editing?`<div class="tabs"><button class="${mode==='single'?'primary':''}" onclick="mode='single';newView()">单条录入</button><button class="${mode==='batch'?'primary':''}" onclick="mode='batch';newView()">批量录入</button></div>`:''}${mode==='batch'&&!editing?`<div class="panel"><h2>批量粘贴原单</h2><p>多份原单之间使用独立的 ---、“下一单”或“第 N 单”分隔。</p><textarea id="batchraw" class="rawbox" placeholder="在此粘贴多份微信群原单…"></textarea><div class="actions"><button class="primary" onclick="previewBatch()">识别并预览</button></div></div><div id="batchpreview"></div>`:`<div class="two"><section class="panel"><h2>01 / ${editing?'原单（保留不变）':'粘贴微信群原单'}</h2><p>自动移除上游单号；请逐项核对识别结果。</p><textarea id="raw" class="rawbox" ${editing?'readonly':''} placeholder="【职位】餐厅服务员\n【雇主】香港某餐厅\n【月薪】HKD 16,800\n【性别】男女不限\n【工作时间】每天10小时">${esc(ZYOrderParser.sanitizeRaw(o.raw))}</textarea>${!editing?'<div class="actions"><button class="primary" onclick="autoParse()">✧ 自动整理</button></div>':''}<p class="note">薪资保持原单格式；全包价可留空，保存后进入待确认。</p></section><section class="panel"><h2>02 / 核对公司单信息</h2><div class="fields">${fields(o,orderFields)}</div><div class="actions"><button class="primary" onclick="saveOrder()">${editing?'保存修改':'保存劳务单'}</button></div></section></div>`}`;priceManual=!!editing}
let converter=null;async function simplify(raw){try{if(!converter){const m=await import('https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/esm/full.js');converter=m.Converter({from:'tw',to:'cn'})}return converter(raw)}catch{toast('简体转换库未加载，原文暂按输入保存，请核对繁体字段');return raw}}
function parse(raw){return ZYOrderParser.parse(raw,code())}
const workerGroups={'基本信息':{name:'姓名',gender:'性别',birthDate:'出生日期',age:'年龄',height:'身高（cm）',weight:'体重（kg）',marital:'婚姻状况',hometown:'籍贯',health:'健康状况',education:'学历',permit:'港澳通行证',idNumber:'身份证号码',idValidity:'身份证有效期',idAddress:'身份证地址',currentAddress:'现居地址'},'香港劳务经历':{workedHongKong:'是否曾来港从事劳务',hkEmployer:'香港雇主',hkExitDate:'离港日期'},'语言及技能':{cantonese:'粤语能力',mandarin:'普通话能力',english:'英语能力',otherLanguages:'其他语言',certificates:'专业证书',hobbies:'特长爱好'},'求职意向与联系方式':{desiredJob1:'第一求职意向',desiredJob2:'第二求职意向',desiredJob3:'第三求职意向',desiredSalary:'期望薪金',phone:'联系电话',alternateContact:'备用联系人'}};const workerDefs=Object.assign({},...Object.values(workerGroups));async function loadWorkers(){const data=await api('/api/workers');workers=data.workers}async function dbWrite(action,value){if(action==='delete'){const w=workers.find(w=>w.id===value);await api('/api/workers',{method:'DELETE',body:{id:value,version:w?._version}})}else{const result=await api('/api/workers',{method:'PUT',body:{worker:value}});value._version=result.version}}

const histDefs={educationHistory:{period:'起止年月',school:'学校 / 培训机构',major:'专业',qualification:'学历 / 资格'},workHistory:{period:'起止年月',employer:'雇主',position:'职位',duties:'工作事项简介'}};function renderHistory(k){$('#'+k).innerHTML=(worker[k]||[]).map((h,i)=>`<div class="panel"><div class="fields">${Object.entries(histDefs[k]).map(([f,n])=>`<label>${n}<input value="${esc(h[f])}" oninput="worker['${k}'][${i}]['${f}']=this.value"></label>`).join('')}</div><button class="danger" style="margin-top:10px" onclick="worker['${k}'].splice(${i},1);renderHistory('${k}')">移除</button></div>`).join('')}function addHistory(k){worker[k]??=[];if(worker[k].length>=(k==='educationHistory'?2:4))return toast('已达到经历条数上限');worker[k].push({});renderHistory(k)}
async function photoUpload(file){if(!file||!file.type.startsWith('image/'))return toast('请选择图片文件');try{const bitmap=await createImageBitmap(file),ratio=Math.min(1,1000/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*ratio);canvas.height=Math.round(bitmap.height*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);worker.photo=canvas.toDataURL('image/jpeg',.82);bitmap.close();$('#photoPreview').innerHTML=`<img src="${worker.photo}" alt="劳工照片">`}catch{toast('图片无法读取，请更换图片')}}function collectWorker(){Object.assign(worker,read(workerDefs,'w'));return !!worker.name||!!toast('请填写姓名')}
async function saveWorker(){if(!collectWorker())return;const now=new Date().toISOString();worker.id??=crypto.randomUUID();worker.createdAt??=now;worker.updatedAt=now;try{await dbWrite('put',worker);worker={};await loadWorkers();go('workerRecords');toast('劳工资料已保存')}catch(e){toast(e.message)}}async function recordsView(){try{await loadWorkers()}catch{$('#content').innerHTML='<p>共享资料读取失败，请检查连接并刷新重试。</p>';return}if(view!=='workerRecords')return;$('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">WORKER RECORDS</div><h1>已登记劳工</h1><p>共 ${workers.length} 份资料 · 团队共享资料</p></div><div class="actions"><button onclick="backup()">下载资料备份</button><button class="primary" onclick="worker={};go('workers')">＋ 新建登记</button></div></div>${workers.length?workers.map(w=>`<div class="card workerrow">${w.photo?`<img class="photo" src="${esc(w.photo)}" alt="${esc(w.name)}">`:'<div class="photo" style="display:grid;place-items:center;color:#8a9bac;font-size:24px">♙</div>'}<div class="info"><h2 data-user-content>${esc(w.name)}</h2><div class="meta"><span data-user-content>${esc(w.gender||'')} · ${esc(workerAge(w)||'—')}岁</span><span data-user-content>${esc(w.desiredJob1)}</span>${!w.desiredJob1?'<span>求职意向未填写</span>':''}<span>更新于 ${esc(day(w.updatedAt))}</span></div></div><button onclick="editWorker('${esc(w.id)}')">编辑</button><button onclick="previewWorker(workers.find(w=>w.id==='${esc(w.id)}'))">预览登记表</button><button class="danger" onclick="deleteWorker('${esc(w.id)}')">删除</button></div>`).join(''):'<div class="panel empty">暂无已登记劳工，点击「新建登记」添加资料。</div>'}`}
function workerAge(w){if(w.age)return w.age;if(!w.birthDate)return '';const b=new Date(w.birthDate),n=new Date();if(isNaN(b))return '';return n.getFullYear()-b.getFullYear()-(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())?1:0)}function editWorker(id){worker=structuredClone(workers.find(w=>w.id===id));go('workers')}async function deleteWorker(id){if(!confirm('确定删除该劳工资料？删除后无法恢复。'))return;try{await dbWrite('delete',id);recordsView()}catch(e){toast(e.message)}}async function backup(){try{await loadWorkers();const blob=new Blob([JSON.stringify({format:'zy-worker-registration-backup',version:1,exportedAt:new Date().toISOString(),workers},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zy-worker-registration-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){toast(e.message)}}
function previewCurrent(){if(collectWorker())previewWorker(worker)}
