const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={dashboard:'今日劳务单总览',orders:'劳务单数据库',workers:'劳工登记表',workerRecords:'已登记劳工',new:'整理新劳务单'},icons=['◫','▤','▧','♙'];let view='dashboard',mode='single',batch=[],editing=null,worker={},workers=[],priceManual=false;const filters={dashboard:{q:'',s:''},orders:{q:'',s:''}};const key='zy-order-desk-v1', today=()=>new Date().toLocaleDateString('en-CA'), day=v=>{const d=new Date(v);return isNaN(d)?'日期未记录':d.toLocaleDateString('en-CA')};let orders=[],revision=0,sessionUser=null,csrf='',saving=false;

function prefix(){const d=new Date();return `ZY-${String(d.getFullYear()).slice(-2)}-${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-`}function code(extra=[]){return prefix()+String(Math.max(0,...orders.concat(extra).filter(o=>o.code?.startsWith(prefix())).map(o=>Number(ZYOrderParser.baseCode(o.code).slice(prefix().length))||0))+1).padStart(2,'0')}
function priceN(v){return Number(String(v||'').replace(/HKD|港币|港元|[$,\s]/gi,'').replace(/[w万]/gi,''))||0}function status(v){return priceN(v)?'ready':'draft'}function priceFmt(v){if(!v)return '待确认';return /[w万]/i.test(v)?v:priceN(v)/10000+'w'}function suggestion(s){const n=Number(String(s).replace(/,/g,'').match(/\d+(\.\d+)?/)?.[0]);return n>0?(Math.floor((n+20000)/1000)*1000/10000).toFixed(1)+'w':''}
function toast(s){$('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),3500)}async function persist(){try{const result=await api('/api/orders',{method:'PUT',body:{orders,revision}});revision=result.revision;return true}catch(e){toast(e.message);return false}}

function go(v){view=v;$('#breadcrumb').textContent=names[v];$('#nav').innerHTML=Object.keys(names).filter(x=>x!=='new').map((k,i)=>`<button class="${k===v?'active':''}" onclick="go('${k}')">${icons[i]}　${names[k]}</button>`).join('');render();window.scrollTo(0,0)}
const orderFields={code:'公司单号',title:'职位名称',employer:'雇主',salary:'薪资待遇（月薪）',gender:'招聘性别',age:'年龄要求',language:'语言要求',hours:'工作时间',shift:'班次',interview:'面试方式 / 时间',rest:'每月休息',workContent:'工作内容',requirements:'工作要求',notes:'其他备注',price:'卓亚全包价'};
function genderSelect(value,attrs){return `<select ${attrs}><option value="">请选择招聘性别</option>${['男','女','男女不限'].map(v=>`<option data-user-content value="${v}" ${value===v?'selected':''}>${v}</option>`).join('')}</select>`}
function fields(obj,defs,pre='o'){return Object.entries(defs).map(([k,n])=>`<label class="${['workContent','requirements','notes'].includes(k)?'wide':''}">${n}${['title','code','name'].includes(k)?' *':''}${k==='gender'&&pre!=='w'?genderSelect(ZYOrderParser.normalizeGender(obj[k]),`id="${pre}-${k}"`):['workContent','requirements','notes'].includes(k)?`<textarea id="${pre}-${k}" rows="2">${esc(obj[k])}</textarea>`:`<input id="${pre}-${k}" value="${esc(obj[k])}" ${k==='birthDate'?'type="date"':''} ${k==='salary'&&pre==='o'?'oninput="salaryChange()"':''} ${k==='price'&&pre==='o'?'oninput="priceManual=true" placeholder="例如 3.8w，可留空"':''}>`}</label>`).join('')}
function read(defs,pre='o'){return Object.fromEntries(Object.keys(defs).map(k=>[k,$('#'+pre+'-'+k).value.trim()]))}function salaryChange(){if(!priceManual&&$('#o-price'))$('#o-price').value=suggestion($('#o-salary').value)}
function publish(o){o=ZYOrderParser.present(o);if(ZYOrderParser.validateCompany(o,true).length)return '这份原单需要重新核对，暂不能生成发布稿';const labels={title:'职位名称',gender:'招聘性别',age:'年龄要求',language:'语言要求',hours:'工作时间',shift:'班次',salary:'工资待遇',rest:'每月休息',workContent:'工作内容',requirements:'工作要求',notes:'其他备注',interview:'面试时间'};return `${o.code}｜${o.title}\n${o.employer?o.employer+'\n':''}`+Object.entries(labels).map(([k,n])=>{const v=k==='notes'?String(o[k]||'').split(/[\n；;。]/).filter(s=>!s.includes('全包')).join('；'):o[k];return v?n+'：'+v:''}).filter(Boolean).join('\n')+'\n卓亚全包价：'+priceFmt(o.price)}
function card(o){o=ZYOrderParser.present(o);return `<article class="card"><div class="order-top"><div><span class="badge" data-user-content>${esc(o.code)}</span><h2 data-user-content>${esc(o.title)}</h2><p style="margin:0 0 14px"><span data-user-content>${esc(o.employer)}</span>${!o.employer?'雇主未填写':''}</p><div class="meta"><span>月薪 <b data-user-content>${esc(o.salary)}</b>${!o.salary?'未填写':''}</span>${o.gender?`<span>性别 <span data-user-content>${esc(o.gender)}</span></span>`:''}<span>年龄 <span data-user-content>${esc(o.age)}</span>${!o.age?'未填写':''}</span><span>录入 ${esc(day(o.createdAt))}</span></div></div><div class="price"><span class="muted">卓亚全包价</span><strong>${esc(o.price?priceFmt(o.price):'待确认')}</strong><span class="badge ${o.status==='draft'?'draft':''}">${o.status==='draft'?'待确认卓亚全包价':'已生成发布稿'}</span>${o.status==='draft'?`<br><button onclick="fillPrice('${esc(o.id)}')">填卓亚全包价 ↗</button>`:''}</div></div><div class="details"><details><summary>原单 · 查看原始内容</summary><pre>${esc(o.raw)}</pre></details><details><summary>公司单 · 查看发布文案</summary>${ZYOrderParser.validateCompany(o,true).length?'<p class="note">这份原单需要重新核对，暂不能生成发布稿</p>':`<pre>${esc(publish(o))}</pre>`}<button onclick="editOrder('${esc(o.id)}')">编辑公司单</button> ${o.status==='ready'?`<button onclick="copyOrder('${esc(o.id)}')">复制公司单</button>`:''}</details></div><div style="text-align:right;margin-top:12px"><button class="danger" onclick="deleteOrder('${esc(o.id)}')">删除</button></div></article>`}
function render(){if(view==='new')return newView();if(view==='workers')return workerView();if(view==='workerRecords')return recordsView();const isToday=view==='dashboard',f=filters[view],all=orders.filter(o=>!isToday||day(o.createdAt)===today());$('#content').innerHTML=`<section class="sticky"><div class="heading"><div><div class="eyebrow">WORKSPACE / ${isToday?'OVERVIEW':'ORDER DATABASE'}</div><h1>${names[view]}</h1><p style="margin:0">${isToday?'每一份机会，都值得认真整理。掌握今日劳务单进度。':'所有劳务单集中管理，原单与公司单随时核对。'}</p></div><button class="primary" onclick="editing=null;go('new')">＋ 整理新劳务单</button></div>${isToday?`<div class="stats">${[['今日劳务单总数',all.length,'','今日录入的全部劳务单'],['待确认卓亚全包价',all.filter(o=>o.status==='draft').length,'draft','核对价格后即可生成发布稿'],['今日已完成劳务单',all.filter(o=>o.status==='ready').length,'ready','公司单已就绪，可直接复制发布']].map(([n,c,s,d])=>`<button class="stat" onclick="filters.dashboard.s='${s}';render();$('#results').scrollIntoView({behavior:'smooth'})">${n}<strong>${c}<span style="font-size:12px;font-weight:400;margin-left:8px;color:#9aa5a0">份</span></strong><small>${d}</small></button>`).join('')}</div>`:'<div style="height:24px"></div>'}<div class="toolbar"><input placeholder="搜索岗位" value="${esc(f.q)}" oninput="filters[view].q=this.value;listRender()"><select onchange="filters[view].s=this.value;listRender()"><option value="">全部状态</option><option value="draft" ${f.s==='draft'?'selected':''}>待确认卓亚全包价</option><option value="ready" ${f.s==='ready'?'selected':''}>已生成发布稿</option></select></div></section><div id="results"></div>`;listRender()}
function listRender(){const f=filters[view],a=orders.filter(o=>(view!=='dashboard'||day(o.createdAt)===today())&&ZYOrderParser.present(o).title.toLowerCase().includes(f.q.toLowerCase())&&(!f.s||o.status===f.s));let html=`<div class="listhead"><b>${view==='dashboard'?'今日劳务单':'全部劳务单'}</b><span class="muted">共 ${a.length} 份</span></div>`;if(!a.length)html+='<div class="panel empty">暂无符合条件的劳务单<br><small>整理一份新劳务单，开始今天的工作。</small></div>';else if(view==='orders'){const groups={};a.forEach(o=>(groups[day(o.createdAt)]??=[]).push(o));Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(d=>{html+=`<h2>${esc(d)}</h2>`+groups[d].map(card).join('')})}else html+=a.map(card).join('');$('#results').innerHTML=html}
async function deleteOrder(id){if(confirm('确定删除这份劳务单？删除后无法恢复。')){const old=orders;orders=orders.filter(o=>o.id!==id);if(!await persist())orders=old;render()}}function editOrder(id){editing=id;mode='single';go('new')}function fillPrice(id){const o=orders.find(x=>x.id===id);$('#modal').innerHTML=`<h2>确认卓亚全包价</h2><p data-user-content>${esc(o.code)} · ${esc(o.title)}</p><label>卓亚全包价<input id="price-input" value="${esc(o.price)}" placeholder="例如 3.8w；空或0为待确认"></label><div class="actions"><button onclick="$('#modal').close()">取消</button><button class="primary" onclick="savePrice('${esc(id)}')">保存价格</button></div>`;$('#modal').showModal()}async function savePrice(id){const o=orders.find(x=>x.id===id),v=$('#price-input').value.trim(),old={...o};Object.assign(o,{price:v,status:status(v)});if(!await persist()){Object.assign(o,old);return}$('#modal').close();render();toast('价格已保存')}async function copyOrder(id){if(!ZYOrderParser.present(orders.find(o=>o.id===id)).gender)return toast('请先编辑公司单，选择男、女或男女不限后再复制');try{await navigator.clipboard.writeText(publish(orders.find(o=>o.id===id)));toast('公司单已复制')}catch{toast('复制失败，请展开公司单选择文字复制')}}
function newView(){const o=ZYOrderParser.present(orders.find(x=>x.id===editing)||{});$('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">ORDER WORKSPACE</div><h1>${editing?'编辑公司单':'整理新劳务单'}</h1><p>移除上游编号，核对原单，再生成清晰的公司发布稿。</p></div><button onclick="editing=null;go('orders')">返回列表</button></div><div class="steps"><span>① 录入原单</span><span>② 确认信息</span><span>③ 确认全包价并生成</span></div>${!editing?`<div class="tabs"><button class="${mode==='single'?'primary':''}" onclick="mode='single';newView()">单条录入</button><button class="${mode==='batch'?'primary':''}" onclick="mode='batch';newView()">批量录入</button></div>`:''}${mode==='batch'&&!editing?`<div class="panel"><h2>批量粘贴原单</h2><p>多份原单之间使用独立的 ---、“下一单”或“第 N 单”分隔。</p><textarea id="batchraw" class="rawbox" placeholder="在此粘贴多份微信群原单…"></textarea><div class="actions"><button class="primary" onclick="previewBatch()">识别并预览</button></div></div><div id="batchpreview"></div>`:`<div class="two"><section class="panel"><h2>01 / ${editing?'原单（保留不变）':'粘贴微信群原单'}</h2><p>自动移除上游单号；请逐项核对识别结果。</p><textarea id="raw" class="rawbox" ${editing?'readonly':''} placeholder="【职位】餐厅服务员\n【雇主】香港某餐厅\n【月薪】HKD 16,800\n【性别】男女不限\n【工作时间】每天10小时">${esc(ZYOrderParser.sanitizeRaw(o.raw))}</textarea>${!editing?'<div class="actions"><button class="primary" onclick="autoParse()">✧ 自动整理</button></div>':''}<p class="note">薪资保持原单格式；全包价可留空，保存后进入待确认。</p></section><section class="panel"><h2>02 / 核对公司单信息</h2><div class="fields">${fields(o,orderFields)}</div><div class="actions"><button class="primary" onclick="saveOrder()">${editing?'保存修改':'保存劳务单'}</button></div></section></div>`}`;priceManual=!!editing}
let converter=null;async function simplify(raw){try{if(!converter){const m=await import('https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/esm/full.js');converter=m.Converter({from:'tw',to:'cn'})}return converter(raw)}catch{toast('简体转换库未加载，原文暂按输入保存，请核对繁体字段');return raw}}
function parse(raw){return ZYOrderParser.parse(raw,code())}
async function autoParse(){const raw=ZYOrderParser.sanitizeRaw(await simplify($('#raw').value.trim()));if(!raw)return toast('请先粘贴原单');$('#raw').value=raw;const o=parse(raw);o.price=suggestion(o.salary);for(const k of Object.keys(orderFields))$('#o-'+k).value=o[k]||'';priceManual=false;toast('整理完成，请核对各项信息')}
async function saveOrder(){const data=read(orderFields),raw=ZYOrderParser.sanitizeRaw($('#raw').value.trim());if(!['男','女','男女不限'].includes(data.gender))return toast('请选择招聘性别：男、女或男女不限');if(!raw||!data.title||!data.code)return toast('请填写原单、职位名称和公司单号');if(!/^ZY-\d{2}-\d{4}-\d{2,}$/.test(data.code))return toast('公司单号格式应为 ZY-年份-月日-流水，例如 ZY-26-1103-01');if(orders.some(o=>o.code===data.code&&o.id!==editing))return toast('公司单号已存在，请修改');const old=orders.map(o=>({...o}));if(editing)Object.assign(orders.find(o=>o.id===editing),data,{status:status(data.price),location:''});else orders.unshift({...data,raw,id:crypto.randomUUID(),createdAt:new Date().toISOString(),status:status(data.price)});if(!await persist()){orders=old;return}editing=null;go('orders');toast('劳务单已保存')}
async function previewBatch(){const raw=await simplify($('#batchraw').value.trim());batch=raw.split(/\n\s*(?:[-_=*]{3,}|下一[单份]|第\s*[\d一二三四五六七八九十]+\s*[单份])\s*\n|\n(?=(?:AT-[\w-]+|ZY-\d{2}-\d{4}-\d+)\b)/).map(s=>s.trim()).filter(Boolean).map(parse);renderBatch()}
function renderBatch(){$('#batchpreview').innerHTML=batch.map((o,i)=>`<div class="panel"><h2>第 ${i+1} 份 · ${esc(o.title||'未识别职位')}</h2><div class="fields">${['title','employer','salary','gender','age'].map(k=>`<label>${orderFields[k]}${k==='gender'?genderSelect(ZYOrderParser.normalizeGender(o[k]),`onchange="batch[${i}].gender=this.value"`):`<input value="${esc(o[k])}" oninput="batch[${i}]['${k}']=this.value">`}</label>`).join('')}</div><details style="margin-top:15px"><summary>编辑该份原文（修改后重新识别）</summary><textarea style="width:100%" rows="6" onchange="batch[${i}]=parse(this.value);renderBatch()">${esc(ZYOrderParser.sanitizeRaw(o.raw))}</textarea></details><button class="danger" onclick="batch.splice(${i},1);renderBatch()">移除此份</button></div>`).join('')+(batch.length?'<button class="primary" onclick="saveBatch()">保存全部为待确认劳务单</button>':'<p>没有可保存的原单</p>')}
async function saveBatch(){if(!batch.length||batch.some(o=>!o.title.trim()))return toast('每份原单都必须有职位名称');if(batch.some(o=>!['男','女','男女不限'].includes(o.gender)))return toast('请为每份原单选择招聘性别：男、女或男女不限');const added=[];batch.forEach(o=>added.push({...o,id:crypto.randomUUID(),code:code(added),createdAt:new Date().toISOString(),price:'',status:'draft'}));const old=orders;orders=added.concat(orders);if(!await persist()){orders=old;return}batch=[];go('orders');toast('批量劳务单已保存')}
const workerGroups={'基本信息':{name:'姓名',gender:'性别',birthDate:'出生日期',age:'年龄',height:'身高（cm）',weight:'体重（kg）',marital:'婚姻状况',hometown:'籍贯',health:'健康状况',education:'学历',permit:'港澳通行证',idNumber:'身份证号码',idValidity:'身份证有效期',idAddress:'身份证地址',currentAddress:'现居地址'},'香港劳务经历':{workedHongKong:'是否曾来港从事劳务',hkEmployer:'香港雇主',hkExitDate:'离港日期'},'语言及技能':{cantonese:'粤语能力',mandarin:'普通话能力',english:'英语能力',otherLanguages:'其他语言',certificates:'专业证书',hobbies:'特长爱好'},'求职意向与联系方式':{desiredJob1:'第一求职意向',desiredJob2:'第二求职意向',desiredJob3:'第三求职意向',desiredSalary:'期望薪金',phone:'联系电话',alternateContact:'备用联系人'}};const workerDefs=Object.assign({},...Object.values(workerGroups));async function loadWorkers(){const data=await api('/api/workers');workers=data.workers}async function dbWrite(action,value){if(action==='delete'){const w=workers.find(w=>w.id===value);await api('/api/workers',{method:'DELETE',body:{id:value,version:w?._version}})}else{const result=await api('/api/workers',{method:'PUT',body:{worker:value}});value._version=result.version}}

function workerView(){$('#content').innerHTML=`<div class="sticky"><div class="heading"><div><div class="eyebrow">WORKER REGISTRATION</div><h1>劳工登记表</h1></div><div class="actions"><button onclick="pdfInfo()">PDF识别</button><button onclick="backup()">下载资料备份</button><button onclick="worker={};workerView()">＋ 新建登记</button></div></div><p class="note">资料与照片保存在团队服务器，授权账号可共同查看与修改。录入前请取得本人授权，并定期备份。</p></div><div class="panel"><div class="upload" id="drop"><div id="photoPreview">${worker.photo?`<img src="${esc(worker.photo)}" alt="劳工照片">`:'＋ 上传或拖放劳工照片'}</div><p>支持图片，自动压缩后保存至团队服务器</p><input type="file" accept="image/*" onchange="photoUpload(this.files[0])"><button onclick="worker.photo='';$('#photoPreview').textContent='＋ 上传照片'">移除照片</button></div>${Object.entries(workerGroups).map(([n,d],i)=>`<h2 style="margin-top:30px">0${i+1} / ${n}</h2><div class="fields">${fields(worker,d,'w')}</div>`).join('')}<h2>教育及培训（最多2条）</h2><div id="educationHistory"></div><button onclick="addHistory('educationHistory')">＋ 添加教育经历</button><h2>工作经历（最多4条）</h2><div id="workHistory"></div><button onclick="addHistory('workHistory')">＋ 添加工作经历</button><div class="actions"><button onclick="previewCurrent()">预览登记表</button><button class="primary" onclick="saveWorker()">保存登记资料</button></div></div>`;renderHistory('educationHistory');renderHistory('workHistory');const drop=$('#drop');drop.ondragover=e=>{e.preventDefault();drop.style.background='#edf3f9'};drop.ondragleave=()=>drop.style.background='';drop.ondrop=e=>{e.preventDefault();drop.style.background='';photoUpload(e.dataTransfer.files[0])}}
const histDefs={educationHistory:{period:'起止年月',school:'学校 / 培训机构',major:'专业',qualification:'学历 / 资格'},workHistory:{period:'起止年月',employer:'雇主',position:'职位',duties:'工作事项简介'}};function renderHistory(k){$('#'+k).innerHTML=(worker[k]||[]).map((h,i)=>`<div class="panel"><div class="fields">${Object.entries(histDefs[k]).map(([f,n])=>`<label>${n}<input value="${esc(h[f])}" oninput="worker['${k}'][${i}]['${f}']=this.value"></label>`).join('')}</div><button class="danger" style="margin-top:10px" onclick="worker['${k}'].splice(${i},1);renderHistory('${k}')">移除</button></div>`).join('')}function addHistory(k){worker[k]??=[];if(worker[k].length>=(k==='educationHistory'?2:4))return toast('已达到经历条数上限');worker[k].push({});renderHistory(k)}
async function photoUpload(file){if(!file||!file.type.startsWith('image/'))return toast('请选择图片文件');try{const bitmap=await createImageBitmap(file),ratio=Math.min(1,1000/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*ratio);canvas.height=Math.round(bitmap.height*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);worker.photo=canvas.toDataURL('image/jpeg',.82);bitmap.close();$('#photoPreview').innerHTML=`<img src="${worker.photo}" alt="劳工照片">`}catch{toast('图片无法读取，请更换图片')}}function collectWorker(){Object.assign(worker,read(workerDefs,'w'));return !!worker.name||!!toast('请填写姓名')}
async function saveWorker(){if(!collectWorker())return;const now=new Date().toISOString();worker.id??=crypto.randomUUID();worker.createdAt??=now;worker.updatedAt=now;try{await dbWrite('put',worker);worker={};await loadWorkers();go('workerRecords');toast('劳工资料已保存')}catch(e){toast(e.message)}}async function recordsView(){try{await loadWorkers()}catch{$('#content').innerHTML='<p>共享资料读取失败，请检查连接并刷新重试。</p>';return}if(view!=='workerRecords')return;$('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">WORKER RECORDS</div><h1>已登记劳工</h1><p>共 ${workers.length} 份资料 · 团队共享资料</p></div><div class="actions"><button onclick="backup()">下载资料备份</button><button class="primary" onclick="worker={};go('workers')">＋ 新建登记</button></div></div>${workers.length?workers.map(w=>`<div class="card workerrow">${w.photo?`<img class="photo" src="${esc(w.photo)}" alt="${esc(w.name)}">`:'<div class="photo" style="display:grid;place-items:center;color:#8a9bac;font-size:24px">♙</div>'}<div class="info"><h2 data-user-content>${esc(w.name)}</h2><div class="meta"><span data-user-content>${esc(w.gender||'')} · ${esc(workerAge(w)||'—')}岁</span><span data-user-content>${esc(w.desiredJob1)}</span>${!w.desiredJob1?'<span>求职意向未填写</span>':''}<span>更新于 ${esc(day(w.updatedAt))}</span></div></div><button onclick="editWorker('${esc(w.id)}')">编辑</button><button onclick="previewWorker(workers.find(w=>w.id==='${esc(w.id)}'))">预览登记表</button><button class="danger" onclick="deleteWorker('${esc(w.id)}')">删除</button></div>`).join(''):'<div class="panel empty">暂无已登记劳工，点击「新建登记」添加资料。</div>'}`}
function workerAge(w){if(w.age)return w.age;if(!w.birthDate)return '';const b=new Date(w.birthDate),n=new Date();if(isNaN(b))return '';return n.getFullYear()-b.getFullYear()-(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())?1:0)}function editWorker(id){worker=structuredClone(workers.find(w=>w.id===id));go('workers')}async function deleteWorker(id){if(!confirm('确定删除该劳工资料？删除后无法恢复。'))return;try{await dbWrite('delete',id);recordsView()}catch(e){toast(e.message)}}async function backup(){try{await loadWorkers();const blob=new Blob([JSON.stringify({format:'zy-worker-registration-backup',version:1,exportedAt:new Date().toISOString(),workers},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zy-worker-registration-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){toast(e.message)}}
function previewCurrent(){if(collectWorker())previewWorker(worker)}function previewWorker(w){$('#modal').innerHTML=`<div class="printsheet"><h1>卓亚港澳劳务 · 劳工登记表</h1><p style="text-align:center">ZY LABOUR SYSTEM · WORKER REGISTRATION</p>${w.photo?`<img src="${esc(w.photo)}" style="height:130px;float:right;margin:10px" alt="劳工照片">`:''}${Object.entries(workerGroups).map(([n,d])=>`<h2>${n}</h2><div class="printgrid">${Object.entries(d).map(([k,label])=>`<div class="printcell"><b>${label}</b><span data-user-content>${esc(w[k]||'—')}</span></div>`).join('')}</div>`).join('')}${Object.entries(histDefs).map(([k,d])=>`<h2>${k==='educationHistory'?'教育及培训':'工作经历'}</h2>${(w[k]||[]).map(h=>`<div class="printgrid">${Object.entries(d).map(([f,n])=>`<div class="printcell"><b>${n}</b><span data-user-content>${esc(h[f]||'—')}</span></div>`).join('')}</div>`).join('')}`).join('')}</div><div class="actions no-print"><button onclick="$('#modal').close()">返回修改</button><button class="primary" onclick="window.print()">打印 / 保存为 PDF</button><p>当前为重建版式；尚未取得原登记表背景模板。</p></div>`;$('#modal').showModal()}
function pdfInfo(){$('#modal').innerHTML='<h2>PDF 模板识别尚待迁移</h2><p>文件未附原登记表背景图、识别坐标及原有识别代码，当前版本无法准确还原固定模板 PDF 识别。请先手动填写并核对资料。</p><p>当前PDF识别尚未实现。</p><button onclick="$(\'#modal\').close()">返回登记表</button>';$('#modal').showModal()}
$('#date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
